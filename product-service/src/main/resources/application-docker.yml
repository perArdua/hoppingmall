spring:
  datasource:
    url: jdbc:mysql://mysql:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&connectionTimeZone=%2B09%3A00&forceConnectionTimeZoneToSession=true&connectTimeout=3000&socketTimeout=30000
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: ${MYSQL_ROOT_PASSWORD}

  flyway:
    enabled: true
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true

  kafka:
    consumer:
      bootstrap-servers: kafka:29092
    properties:
      schema.registry.url: http://schema-registry:8081

  data:
    redis:
      cluster:
        nodes:
          - redis-node-1:7001
          - redis-node-2:7002
          - redis-node-3:7003
      redisson:
        config: |
          clusterServersConfig:
            nodeAddresses:
              - "redis://redis-node-1:7001"
              - "redis://redis-node-2:7002"
              - "redis://redis-node-3:7003"
            scanInterval: 1000
management:
  metrics:
    tags:
      application: product-service
  tracing:
    sampling:
      probability: 1.0
    enabled: true
  otlp:
    tracing:
      endpoint: http://tempo:4318/v1/traces

services:
  order-service:
    url: http://order-service:8084

file:
  storage:
    endpoint: ${STORAGE_ENDPOINT:http://s3mock:9090}

springdoc:
  api-docs:
    enabled: ${API_DOCS_ENABLED:false}
  swagger-ui:
    enabled: ${API_DOCS_ENABLED:false}

internal:
  service:
    token: ${INTERNAL_SERVICE_TOKEN}

grpc:
  client:
    order-service:
      address: dns:///order-service:9094
      negotiation-type: plaintext

inventory:
  mode: bucket
  link-check:
    enabled: true
