server.port=8087
spring.application.name=consistency-monitor

spring.datasource.url=${CONSISTENCY_DB_URL:jdbc:mysql://localhost:3306/consistency_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${CONSISTENCY_DB_USERNAME:root}
spring.datasource.password=${CONSISTENCY_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-init-sql=SET time_zone = '${CONSISTENCY_DATA_TIME_ZONE:+09:00}'
spring.sql.init.mode=always

management.endpoints.web.exposure.include=health,info,prometheus
management.metrics.tags.application=consistency-monitor

consistency.interval-ms=${CONSISTENCY_INTERVAL_MS:60000}
consistency.initial-delay-ms=${CONSISTENCY_INITIAL_DELAY_MS:10000}
consistency.params.PENDING_MAX_MINUTES=${PENDING_MAX_MINUTES:10}
consistency.params.PAYING_MAX_MINUTES=${PAYING_MAX_MINUTES:15}
consistency.params.ORPHAN_GRACE_MINUTES=${ORPHAN_GRACE_MINUTES:1}
consistency.params.OUTBOX_MAX_SECONDS=${OUTBOX_MAX_SECONDS:60}
consistency.params.DLQ_MAX_SECONDS=${DLQ_MAX_SECONDS:60}
