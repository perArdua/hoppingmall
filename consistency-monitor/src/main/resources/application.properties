server.port=8087
spring.application.name=consistency-monitor
spring.jackson.property-naming-strategy=SNAKE_CASE

spring.datasource.url=${CONSISTENCY_DB_URL:jdbc:mysql://localhost:3306/consistency_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
spring.datasource.username=${CONSISTENCY_DB_USERNAME:root}
spring.datasource.password=${CONSISTENCY_DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=2
spring.datasource.hikari.connection-init-sql=SET time_zone = '${CONSISTENCY_DATA_TIME_ZONE:+09:00}'
spring.sql.init.mode=always

jwt.secret=${JWT_SECRET}

spring.data.redis.timeout=500ms
spring.data.redis.connect-timeout=500ms

management.endpoints.web.exposure.include=health,info,prometheus
management.health.redis.enabled=false
management.metrics.tags.application=consistency-monitor

consistency.interval-ms=${CONSISTENCY_INTERVAL_MS:60000}
consistency.initial-delay-ms=${CONSISTENCY_INITIAL_DELAY_MS:10000}
consistency.lease.seconds=60
consistency.lease.renew-ms=20000
consistency.full-sweep.interval-ms=${CONSISTENCY_FULL_SWEEP_INTERVAL_MS:21600000}
consistency.full-sweep.initial-delay-ms=${CONSISTENCY_FULL_SWEEP_INITIAL_DELAY_MS:300000}
consistency.full-sweep.chunk-size=${CONSISTENCY_FULL_SWEEP_CHUNK_SIZE:5000}
consistency.recent-window-minutes=${CONSISTENCY_RECENT_WINDOW_MINUTES:10}
consistency.lookup-batch-size=${CONSISTENCY_LOOKUP_BATCH_SIZE:500}
consistency.data-time-zone=${CONSISTENCY_DATA_TIME_ZONE:+09:00}
consistency.sources.order.url=${CONSISTENCY_ORDER_DB_URL:jdbc:mysql://localhost:3306/order_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
consistency.sources.order.username=${CONSISTENCY_ORDER_DB_USERNAME:${CONSISTENCY_DB_USERNAME:root}}
consistency.sources.order.password=${CONSISTENCY_ORDER_DB_PASSWORD:${CONSISTENCY_DB_PASSWORD:}}
consistency.sources.payment.url=${CONSISTENCY_PAYMENT_DB_URL:jdbc:mysql://localhost:3306/payment_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
consistency.sources.payment.username=${CONSISTENCY_PAYMENT_DB_USERNAME:${CONSISTENCY_DB_USERNAME:root}}
consistency.sources.payment.password=${CONSISTENCY_PAYMENT_DB_PASSWORD:${CONSISTENCY_DB_PASSWORD:}}
consistency.sources.product.url=${CONSISTENCY_PRODUCT_DB_URL:jdbc:mysql://localhost:3306/product_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
consistency.sources.product.username=${CONSISTENCY_PRODUCT_DB_USERNAME:${CONSISTENCY_DB_USERNAME:root}}
consistency.sources.product.password=${CONSISTENCY_PRODUCT_DB_PASSWORD:${CONSISTENCY_DB_PASSWORD:}}
consistency.sources.user.url=${CONSISTENCY_USER_DB_URL:jdbc:mysql://localhost:3306/user_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
consistency.sources.user.username=${CONSISTENCY_USER_DB_USERNAME:${CONSISTENCY_DB_USERNAME:root}}
consistency.sources.user.password=${CONSISTENCY_USER_DB_PASSWORD:${CONSISTENCY_DB_PASSWORD:}}
consistency.sources.notification.url=${CONSISTENCY_NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/notification_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Seoul}
consistency.sources.notification.username=${CONSISTENCY_NOTIFICATION_DB_USERNAME:${CONSISTENCY_DB_USERNAME:root}}
consistency.sources.notification.password=${CONSISTENCY_NOTIFICATION_DB_PASSWORD:${CONSISTENCY_DB_PASSWORD:}}
spring.task.scheduling.pool.size=3
consistency.params.PENDING_MAX_MINUTES=${PENDING_MAX_MINUTES:10}
consistency.params.PAYING_MAX_MINUTES=${PAYING_MAX_MINUTES:15}
consistency.params.ORPHAN_GRACE_MINUTES=${ORPHAN_GRACE_MINUTES:1}
consistency.params.OUTBOX_MAX_SECONDS=${OUTBOX_MAX_SECONDS:60}
consistency.params.DLQ_MAX_SECONDS=${DLQ_MAX_SECONDS:60}
consistency.params.POINT_PAYMENT_SINCE=${POINT_PAYMENT_SINCE:2026-11-16 06:02:19}
